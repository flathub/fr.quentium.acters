id: fr.quentium.acters
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: stacer
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: acters
    buildsystem: cmake-ninja
    config-opts:
      - -DFLATHUB_BUILD=ON
    sources:
      - type: git
        url: https://github.com/QuentiumYT/Stacer.git
        tag: v1.7.0
        commit: e3fbf362b7836392365904ed9aa64e256bd54124
        x-checker-data:
          type: git
          tag-pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
