id: fr.quentium.acters
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: stacer
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: acters
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/QuentiumYT/Stacer.git
        tag: v1.6.3
        commit: 5671215dc2f36e340b5f101ef0355119aef8241d
        x-checker-data:
          type: git
          tag-pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
